name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1 Checkout
        uses: actions/checkout@v4

      - name: 2 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3 Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 4 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 5 Prebuild Android
        run: npx expo prebuild -p android --no-install

      - name: 6 Bundle JS (diagnostic)
        run: |
          set -o pipefail
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res 2>&1 | tail -n 40
          echo "BUNDLE_OK"

      - name: 7 Patch Gradle wrapper (smaller dist + longer timeout)
        run: |
          cd android
          sed -i 's/gradle-8.8-all.zip/gradle-8.8-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          grep -q networkTimeout gradle/wrapper/gradle-wrapper.properties || \
            echo "networkTimeout=120000" >> gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: 8 Build Release APK (with retry)
        run: |
          cd android
          chmod +x gradlew
          n=0
          until [ "$n" -ge 3 ]; do
            ./gradlew assembleRelease && break
            n=$((n+1))
            echo "Gradle attempt $n failed - retrying in 20s"
            sleep 20
          done
          if [ "$n" -ge 3 ]; then echo "Gradle failed after 3 attempts"; exit 1; fi

      - name: 9 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketagent-pro-apk
          path: android/app/build/outputs/apk/release/app-release.apk
